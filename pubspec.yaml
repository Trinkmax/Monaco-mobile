name: monaco_mobile
description: "Monaco Barber Studio — app de clientes"
publish_to: 'none'
version: 2.0.0+20

environment:
  sdk: ^3.10.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Supabase
  supabase_flutter: ^2.9.0

  # HTTP (API mobile del dashboard)
  http: ^1.2.2

  # Security & Auth
  flutter_secure_storage: ^9.2.4
  local_auth: ^2.3.0
  crypto: ^3.0.6

  # Push Notifications
  firebase_core: ^3.12.1
  firebase_messaging: ^15.2.4
  flutter_local_notifications: ^18.0.1

  # UI & Animations
  flutter_animate: ^4.5.2
  qr_flutter: ^4.1.0
  cached_network_image: ^3.4.1
  smooth_page_indicator: ^1.2.0+3

  # Geolocation (orden por cercanía en la selección de sucursal)
  geolocator: ^13.0.2

  # Utilities
  intl: ^0.20.2
  url_launcher: ^6.3.1
  package_info_plus: ^8.1.3
  share_plus: ^10.1.2

  cupertino_icons: ^1.0.8
  audioplayers: ^6.7.1
  liquid_glass_renderer: ^0.2.0-dev.4

  # path_provider_foundation 2.5+ pasó a "native assets" (paquete objective_c):
  # genera un objective_c.framework firmado AD-HOC que iOS rechaza al instalar
  # en un iPhone con firma de desarrollo ("invalid signature"). Se fija la 2.4.x
  # hasta que Flutter firme esos frameworks como el resto (no cambia nada
  # funcional: path_provider sólo lo usa supabase/shared_preferences).
  path_provider_foundation: ">=2.4.0 <2.5.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/brand/
    - assets/sounds/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Light.ttf
          weight: 300
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Poppins-Black.ttf
          weight: 900

# ── Ícono de la app (flutter_launcher_icons) ────────────────────────────────
# Regenerar con: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: assets/brand/app_icon.png
  adaptive_icon_background: "#0A0A0A"
  adaptive_icon_foreground: assets/brand/app_icon_foreground.png
  adaptive_icon_monochrome: assets/brand/app_icon_foreground.png
  min_sdk_android: 24

# ── Splash nativo (flutter_native_splash) ───────────────────────────────────
# Regenerar con: dart run flutter_native_splash:create
flutter_native_splash:
  color: "#0A0A0A"
  image: assets/brand/splash_logo.png
  android_12:
    color: "#0A0A0A"
    image: assets/brand/splash_logo.png
    icon_background_color: "#0A0A0A"
  ios: true
  android: true
  fullscreen: false
