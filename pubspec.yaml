name: monaco_mobile
description: "Monaco Barber Studio — app de clientes"
publish_to: 'none'
version: 2.0.0+21

environment:
  sdk: ^3.10.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Supabase
  supabase_flutter: ^2.9.0

  # HTTP (API mobile del dashboard)
  http: ^1.2.2

  # Security & Auth
  flutter_secure_storage: ^9.2.4
  local_auth: ^2.3.0
  crypto: ^3.0.6

  # ── Alta propia de cuentas (Google / Apple) ───────────────────────────────
  # El id_token que devuelven estos paquetes NO se le entrega a
  # `supabase.auth.signInWithIdToken`: va a nuestra edge function `client-auth`
  # (acción `social`). Ver el comentario largo en `social_auth_service.dart`.
  #
  # google_sign_in 7.x rehízo la API (singleton `GoogleSignIn.instance`,
  # `initialize()` una sola vez por proceso, `account.authentication` con sólo
  # `idToken`). Pide Dart ^3.7 / Flutter >=3.29: entra en 3.10.3 / 3.38.4.
  google_sign_in: ^7.2.0

  # OJO con el rango: `sign_in_with_apple` 8.x pide Dart ^3.11 (8.0/8.1) y
  # ^3.12 + Flutter >=3.44 (8.2), y este proyecto está en Dart 3.10.3 /
  # Flutter 3.38.4 — o sea que `^8.2.0` NO resuelve acá. La 7.0.1 es la última
  # que soporta este SDK y trae la misma API que necesitamos
  # (`getAppleIDCredential(nonce:)`, `givenName`/`familyName`). Mismo criterio
  # que el tope de `flutter_custom_tabs` de más abajo: se sube cuando suba el
  # Flutter del proyecto, no antes.
  sign_in_with_apple: ">=7.0.1 <8.0.0"

  # Push Notifications
  firebase_core: ^3.12.1
  firebase_messaging: ^15.2.4
  flutter_local_notifications: ^18.0.1

  # Telemetría de crashes. **Condicional**: `main.dart` sólo engancha los
  # handlers si Firebase arrancó de verdad (`firebase_options.dart` sin
  # placeholders), así que hasta que el dueño corra `flutterfire configure`
  # esto es peso muerto y nada más — no rompe ni cambia el arranque.
  #
  # El rango es `^4.3.10` y NO `^5`: la 5.x pide firebase_core 4.x y este
  # proyecto está clavado en core 3.15.x junto con firebase_messaging 15.x
  # (subir esa major es un ciclo aparte, ver "Deuda de dependencias" en el
  # README). Un `pub upgrade --major-versions` distraído arrastraría las tres.
  firebase_crashlytics: ^4.3.10

  # UI & Animations
  flutter_animate: ^4.5.2
  qr_flutter: ^4.1.0
  cached_network_image: ^3.4.1
  smooth_page_indicator: ^1.2.0+3

  # Geolocation (orden por cercanía en la selección de sucursal)
  geolocator: ^13.0.2

  # Utilities
  intl: ^0.20.2
  url_launcher: ^6.3.1

  # Checkout de Mercado Pago (seña) — Custom Tabs en Android.
  #
  # Mercado Pago DESHABILITÓ el modelo WebView para todas las integraciones: el
  # checkout tiene que abrirse en el navegador del sistema, con su barra de URL
  # y sus credenciales guardadas. Por eso NO hay `webview_flutter` acá.
  #
  # Se fija <2.6.0 a propósito: la 2.6.0 pide Dart ^3.12 / Flutter >=3.44 y este
  # proyecto está en 3.10.3 / 3.38.4. Sin el tope, un `pub upgrade --major` en
  # una máquina con Flutter nuevo la sube y el build local deja de resolver.
  flutter_custom_tabs: ">=2.5.0 <2.6.0"

  # Deep link de vuelta desde el navegador (monaco://pago?deposit=<id>).
  # Ya venía como dependencia transitiva de supabase_flutter; se declara
  # explícita porque ahora hay código nuestro que la importa.
  app_links: ^6.4.1

  # Almacén que **se borra con la desinstalación** (NSUserDefaults / Shared-
  # Preferences), que es exactamente lo que el Keychain no hace: lo usa
  # `core/auth/install_guard.dart` para detectar una reinstalación y limpiar la
  # sesión que sobrevivió. Ya venía transitiva por `supabase_flutter` (es su
  # storage por defecto); se declara directa porque hay código nuestro que la
  # importa. Versión: la que ya resuelve el lock (2.5.5).
  shared_preferences: ^2.5.5
  package_info_plus: ^8.1.3
  share_plus: ^10.1.2

  cupertino_icons: ^1.0.8
  audioplayers: ^6.7.1
  liquid_glass_renderer: ^0.2.0-dev.4

  # path_provider_foundation 2.5+ pasó a "native assets" (paquete objective_c):
  # genera un objective_c.framework firmado AD-HOC que iOS rechaza al instalar
  # en un iPhone con firma de desarrollo ("invalid signature"). Se fija la 2.4.x
  # hasta que Flutter firme esos frameworks como el resto (no cambia nada
  # funcional: path_provider sólo lo usa supabase/shared_preferences).
  path_provider_foundation: ">=2.4.0 <2.5.0"
  sensors_plus: ^7.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/sounds/
    # `assets/brand/` NO va acá: son los INSUMOS de flutter_launcher_icons y
    # flutter_native_splash (ver más abajo), que los leen del path del proyecto,
    # no del bundle. Ningún .dart los referencia (verificado con grep), así que
    # empaquetarlos era mandar 164 KB de PNG al teléfono para nada.

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Light.ttf
          weight: 300
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Poppins-Black.ttf
          weight: 900

# ── Ícono de la app (flutter_launcher_icons) ────────────────────────────────
# Regenerar con: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: assets/brand/app_icon.png
  adaptive_icon_background: "#0A0A0A"
  # Foreground/monochrome del ícono adaptativo (Android 8+): la M al 60 % del
  # canvas. flutter_launcher_icons le suma su inset del 16 %, así que en el
  # canvas de 108 dp queda de ~44 dp, dentro de la zona segura de 66 dp y con
  # el mismo peso visual que la M del ícono de iOS/legacy (56 % del lado).
  # `app_icon_foreground.png` (la M al 42 %) sumado al inset la dejaba al 43 %
  # del círculo visible: doble margen. Ese archivo sigue siendo la fuente de
  # `drawable/ic_notification` y no se toca.
  adaptive_icon_foreground: assets/brand/app_icon_foreground_adaptive.png
  adaptive_icon_monochrome: assets/brand/app_icon_foreground_adaptive.png
  min_sdk_android: 24

# ── Splash nativo (flutter_native_splash) ───────────────────────────────────
# Regenerar con: dart run flutter_native_splash:create
flutter_native_splash:
  color: "#0A0A0A"
  image: assets/brand/splash_logo.png
  android_12:
    color: "#0A0A0A"
    # Android 12+ enmascara el ícono del splash con un círculo de 2/3 del
    # canvas (240 dp de ícono, 160 dp visibles): con `splash_logo.png` (la M
    # al 49 % del alto) las cuatro puntas quedaban afuera y se veían cortadas.
    # Este archivo lleva la misma M al 40 % del alto (radio máximo 30 % del
    # lado, contra 33 % de la máscara). `image:` (API < 31, iOS) no tiene
    # máscara y sigue con el logo original.
    image: assets/brand/splash_logo_android12.png
    icon_background_color: "#0A0A0A"
  ios: true
  android: true
  fullscreen: false
